[loggers] # кто логирует
keys=root # корневой логгер root

[handlers]  # куда пишутся логи
keys=consoleHandler,fileHandler

[formatters] # как форматировать сообщения
keys=simpleFormatter # имя форматера

[logger_root] # настройки корневого логгера
level=INFO
handlers=consoleHandler,fileHandler

[handler_consoleHandler] # вывод в консоль
class=StreamHandler # пишет в поток
level=INFO
formatter=simpleFormatter
args=(sys.stdout,) # куда, именно писать sys.stdout, - консоль

[handler_fileHandler] # запись в файл
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('logs/etl.log', 'a')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s